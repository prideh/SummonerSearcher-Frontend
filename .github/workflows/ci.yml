name: Frontend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Grant execute permission for preflight script
      run: chmod +x scripts/preflight.sh
    - name: Run shared preflight (tsc -b + vitest + lint + build)
      run: ./scripts/preflight.sh
